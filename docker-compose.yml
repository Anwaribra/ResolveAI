version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-resolveai_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolveai} -d ${POSTGRES_DB:-resolveai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolveai-api
    command: uvicorn api.src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-resolveai}:${POSTGRES_PASSWORD:-resolveai_secret}@postgres:5432/${POSTGRES_DB:-resolveai_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolveai-dashboard
    command: streamlit run dashboard/src/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-resolveai}:${POSTGRES_PASSWORD:-resolveai_secret}@postgres:5432/${POSTGRES_DB:-resolveai_db}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
