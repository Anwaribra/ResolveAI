[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai"
version = "0.1.0"
description = "Support Ticket Triage & Auto-Resolution Agent with Data Engineering & Evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Anwar Ibrahim"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "google-genai>=0.1.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "sqlalchemy>=2.0.28",
    "pandas>=2.2.0",
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
    "streamlit>=1.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
eval = [
    "ragas>=0.1.0",
    "deepeval>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "ingestion*", "features*", "evaluation*", "dashboard*", "airflow*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
